[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utau-lyrics-mcp"
version = "0.1.0"
description = "Test version: MCP server and UTAU plugin that turn lyrics and chords into a .ust and a backing track"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
utau-lyrics-mcp = "utau_lyrics_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
utau_lyrics_mcp = ["plugin_files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
