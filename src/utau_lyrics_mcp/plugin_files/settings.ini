; Settings for the UTAU plugin. Edit, save, then run the plugin on a selection.
[song]
; Bars separated by |, chords in one bar share it, % repeats the previous bar.
; The progression starts at the first selected note and loops.
chords = C | Am | F | G
key = C
voice_range = A3-C5
; Change the seed for a different melody over the same chords.
seed = 0
beats_per_bar = 4

; Backing track written to output_dir as plugin_backing.wav / .mid
; (empty output_dir = "utau-lyrics-mcp-output" in your user folder).
backing = yes
instrument = piano
style = arpeggio
bass = yes
drums = no
; 0-1 level of a flute doubling the melody as a pitch reference; 0 = off.
guide_volume = 0.35
output_dir =
; Optional .sf2 SoundFont, used when FluidSynth is installed.
soundfont =
